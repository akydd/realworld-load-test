services:
  seeder:
    image: postgres:17-alpine
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8090}
      DATABASE_URL: ${DATABASE_URL:-postgres://admin:password@host.docker.internal:8095/app}
    volumes:
      - ./seed/seed.sql:/seed.sql:ro
      - ./seed/wait-and-seed.sh:/wait-and-seed.sh:ro
    command: sh /wait-and-seed.sh
    extra_hosts:
      - "host.docker.internal:host-gateway"

  k6:
    image: grafana/k6
    command: run /scripts/script.js
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8090}
      DURATION: ${DURATION:-1h}
      MODE: ${MODE:-all}
      RATE: ${RATE:-}
    volumes:
      - ./script.js:/scripts/script.js:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      seeder:
        condition: service_completed_successfully
